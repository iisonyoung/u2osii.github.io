<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>Loves translation bubble fixture</title>
    <link rel="stylesheet" href="../../css/loves.css?v=20260719-friend-phone-bilingual-v8">
</head>
<body>
    <div id="friend-reverse-chat-view">
        <div class="friend-phone-bubble-translatable" role="button" tabindex="0" aria-expanded="false">
            <span>Good night</span>
            <span class="friend-phone-translation friend-phone-bubble-translation" hidden>晚安</span>
        </div>
    </div>
    <section id="translation-boundary-fixture">
        <div id="outer-safari">weather tomorrow</div>
        <div id="outer-weibo">A public post preview</div>
        <div id="outer-file">private-note.txt</div>
        <div id="detail-safari"></div>
        <div id="detail-weibo"></div>
        <div id="detail-file"></div>
    </section>
    <script src="../../js/loves.js?v=20260719-friend-phone-bilingual-v13"></script>
    <script>
        window.lovesApp.bindFriendPhoneTranslationDelegation(document.getElementById('friend-reverse-chat-view'));
        document.getElementById('detail-safari').innerHTML =
            window.lovesApp.renderFriendPhoneLocalized({ title: 'Weather', titleTranslationZh: '天气' }, 'title') +
            window.lovesApp.renderFriendPhoneLocalized({ content: 'It will rain.', contentTranslationZh: '明天会下雨。' }, 'content');
        document.getElementById('detail-weibo').innerHTML =
            window.lovesApp.renderFriendPhoneLocalized({ text: 'Detail post', textTranslationZh: '详情帖子' }, 'text') +
            window.lovesApp.renderFriendPhoneLocalized({ text: 'Detail comment', textTranslationZh: '详情评论' }, 'text');
        document.getElementById('detail-file').innerHTML =
            window.lovesApp.renderFriendPhoneLocalized({ content: 'Private file body', contentTranslationZh: '私密文件正文' }, 'content');
    </script>
</body>
</html>
